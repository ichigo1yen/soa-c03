<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>学習クイズ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <div>
        <span class="eyebrow">学習クイズ</span>
        <h1 id="set-title" class="set-title">読み込み中…</h1>
      </div>
      <a class="home-link" href="index.html">← セット一覧に戻る</a>
    </header>

    <div class="toolbar">
      <div class="nav-links">
        <a id="prev-link" class="btn btn-small btn-outline" href="#">← 前</a>
        <select id="set-select" aria-label="問題セットを選択"></select>
        <a id="next-link" class="btn btn-small btn-outline" href="#">次 →</a>
      </div>
      <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
        <span id="progress-summary" class="progress-summary"></span>
        <button id="toggle-all-btn" type="button" class="btn btn-small">すべての解答を表示</button>
        <button id="reset-btn" type="button" class="btn btn-small btn-outline">進捗リセット</button>
      </div>
    </div>

    <ol class="questions-outer" id="question-list" style="list-style:none; margin:0; padding:0;">
      <li class="empty-state">問題を読み込んでいます…</li>
    </ol>

    <div class="pager" id="pager-bottom"></div>

    <footer class="site-footer">静的サイト (HTML / JS / JSON) — S3 + CloudFront 想定</footer>
  </div>

  <script src="assets/quiz.js"></script>
</body>
</html>
